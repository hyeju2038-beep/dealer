<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조선 명가 오락 주막</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0d0a06;
  --bg-mid: #1a1208;
  --wood-dark: #2c1a0a;
  --wood-mid: #3d2510;
  --wood-light: #5c3a1e;
  --wood-highlight: #7a4e28;
  --gold: #c8941a;
  --gold-light: #f0c040;
  --gold-pale: #fae08a;
  --red: #8b1a1a;
  --red-bright: #c0392b;
  --cream: #f5e6c8;
  --parchment: #e8d4a0;
  --ink: #1a0f05;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-dark);
  background-image: radial-gradient(circle at center, var(--bg-mid) 0%, var(--bg-dark) 100%);
  color: var(--cream);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
}

h1, h2, h3 {
  font-family: 'Noto Serif KR', serif;
}

.header {
  text-align: center;
  margin-bottom: 40px;
  border-bottom: 2px double var(--gold);
  padding-bottom: 20px;
  width: 100%;
  max-width: 800px;
}

.header h1 {
  font-size: 2.5rem;
  color: var(--gold-light);
  text-shadow: 0 4px 8px rgba(0,0,0,0.7);
  letter-spacing: 2px;
}

.header p {
  font-size: 1rem;
  color: var(--parchment);
  margin-top: 8px;
  opacity: 0.8;
}

/* 게임 선택 그리드 */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 25px;
  width: 100%;
  max-width: 800px;
  margin-bottom: 50px;
}

.game-card {
  background: linear-gradient(135deg, var(--wood-mid) 0%, var(--wood-dark) 100%);
  border: 3px solid var(--wood-light);
  border-radius: 8px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
}

.game-card:hover {
  transform: translateY(-5px);
  border-color: var(--gold);
  box-shadow: 0 15px 30px rgba(200, 148, 26, 0.2);
}

.game-card h2 {
  color: var(--gold-pale);
  font-size: 1.5rem;
  margin-bottom: 12px;
}

.game-card p {
  color: var(--cream);
  font-size: 0.9rem;
  opacity: 0.75;
  line-height: 1.4;
  margin-bottom: 20px;
}

.btn-play {
  background: var(--wood-highlight);
  color: var(--gold-pale);
  border: 1px solid var(--gold);
  padding: 8px 20px;
  font-weight: bold;
  border-radius: 4px;
  font-family: 'Noto Serif KR', serif;
  transition: background 0.2s;
}

.game-card:hover .btn-play {
  background: var(--gold);
  color: var(--ink);
}

/* 대통합 장부 (결과 내역) */
.log-section {
  width: 100%;
  max-width: 800px;
  background: var(--parchment);
  color: var(--ink);
  border-radius: 6px;
  padding: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.6);
  border: 4px double var(--wood-dark);
}

.log-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
  margin-bottom: 15px;
}

.log-header h2 {
  font-size: 1.3rem;
  font-weight: 700;
}

.btn-clear {
  background: var(--red);
  color: white;
  border: none;
  padding: 4px 10px;
  font-size: 0.8rem;
  border-radius: 3px;
  cursor: pointer;
}

.btn-clear:hover { background: var(--red-bright); }

.log-table-container {
  max-height: 300px;
  overflow-y: auto;
}

.log-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.95rem;
}

.log-table th, .log-table td {
  padding: 10px;
  text-align: left;
  border-bottom: 1px solid rgba(26, 15, 5, 0.15);
}

.log-table th {
  font-family: 'Noto Serif KR', serif;
  font-weight: bold;
  background: rgba(0, 0, 0, 0.05);
}

.badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 0.8rem;
  font-weight: bold;
  color: #fff;
}
.badge.win { background-color: #2d6a4f; }
.badge.lose { background-color: var(--red); }
.badge.draw { background-color: #555; }

.no-log {
  text-align: center;
  padding: 30px;
  color: #666;
  font-style: italic;
}
</style>
</head>
<body>

  <div class="header">
    <h1>조선 명가 오락 주막</h1>
    <p>세 가지의 격조 높은 경합을 한곳에서 즐겨보시게</p>
  </div>

  <div class="game-grid">
    <a href="./indianpoker_js.html" class="game-card">
      <h2>인디언 포-카</h2>
      <p>상대의 패는 보이나 나의 패는 보이지 않는다. 오직 담력과 심리전으로 승부하는 전통 마작풍 경합.</p>
      <span class="btn-play">입장하기</span>
    </a>
    
    <a href="./indian_blackjack_js.html" class="game-card">
      <h2>인디언 블랙잭</h2>
      <p>인디언 포커의 규칙에 21점 블랙잭의 묘미를 결합하여 수 싸움을 한층 더 진화시킨 경합.</p>
      <span class="btn-play">입장하기</span>
    </a>
    
    <a href="./blackjack_js.html" class="game-card">
      <h2>조선 블랙잭</h2>
      <p>물주(딜러)와 겨루어 21점에 가장 가까운 자가 승리하는 가 장부 기반의 정통 타짜 경합.</p>
      <span class="btn-play">입장하기</span>
    </a>
  </div>

  <div class="log-section">
    <div class="log-header">
      <h2>대통합 오락 장부 (최근 기록)</h2>
      <button class="btn-clear" onclick="clearLogs()">장부 초기화</button>
    </div>
    <div class="log-table-container">
      <table class="log-table" id="logTable">
        <thead>
          <tr>
            <th style="width: 25%;">경합 종류</th>
            <th style="width: 20%;">일시</th>
            <th style="width: 15%;">결과</th>
            <th style="width: 40%;">상세 정보</th>
          </tr>
        </thead>
        <tbody id="logBody">
          </tbody>
      </table>
    </div>
  </div>

<script>
function loadLogs() {
  const logBody = document.getElementById('logBody');
  const logs = JSON.parse(localStorage.getItem('joseon_arcade_unified_logs') || '[]');
  
  if (logs.length === 0) {
    logBody.innerHTML = `<tr><td colspan="4" class="no-log">아직 기록된 경합 내역이 없네. 게임을 시작해보시게!</td></tr>`;
    return;
  }
  
  logBody.innerHTML = logs.map(l => {
    let badgeClass = 'draw';
    if(l.result.includes('승') || l.result.includes('Win')) badgeClass = 'win';
    if(l.result.includes('패') || l.result.includes('Lose')) badgeClass = 'lose';
    
    return `<tr>
      <td style="font-weight:bold;">${l.game}</td>
      <td style="font-size:0.85rem; color:#555;">${l.time}</td>
      <td><span class="badge ${badgeClass}">${l.result}</span></td>
      <td style="font-size:0.9rem;">${l.detail}</td>
    </tr>`;
  }).join('');
}

function clearLogs() {
  if (confirm('정말로 주막의 모든 전적 장부를 불태우시겠습니까?')) {
    localStorage.removeItem('joseon_arcade_unified_logs');
    loadLogs();
  }
}

// 페이지가 켜질 때 장부 자동 로드
window.onload = loadLogs;
</script>
</body>
</html>
